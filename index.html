                this.player.body.setOffset((128-50)/2, (120-50)/2);
                this.player.setCollideWorldBounds(true);
                this.player.setDepth(10);
                console.log('Player created at', this.player.x, this.player.y);

                this.physics.add.collider(this.player, this.walls);

                // Create spike hazards in strategic locations
                this.spikes = [];
                
                // Spike 1: Near first fragment area (narrow passage)
                this.spikes.push(new SpikeHazard(this, 250, 200));
                
                // Spike 2: In the middle corridor
                this.spikes.push(new SpikeHazard(this, 450, 300));
                
                // Spike 3: Near the third fragment (requires careful navigation)
                this.spikes.push(new SpikeHazard(this, 550, 450));
                
                // Spike 4: Near a wall corner (adds challenge)
                this.spikes.push(new SpikeHazard(this, 350, 380));
                
                // Spike 5: Near the pedestal approach
                this.spikes.push(new SpikeHazard(this, 620, 320));
                
                console.log('Created', this.spikes.length, 'spike hazards');

                // 4 Fragments
                this.fragments = this.physics.add.group();
                this.fragments.create(300, 200, 'fragment').setScale(0.25).setDepth(10);
                this.fragments.create(500, 300, 'fragment').setScale(0.25).setDepth(10);
                this.fragments.create(600, 450, 'fragment').setScale(0.25).setDepth(10);
                this.fragments.create(400, 400, 'fragment').setScale(0.25).setDepth(10);

                this.fragmentsCollected = 0;

                this.physics.add.overlap(this.player, this.fragments, (p, f) => {
                    // Play pop sound effect
                    this.playPopSound();
                    
                    f.destroy();
                    this.fragmentsCollected++;
                    this.fragmentText.setText(`Fragments: ${this.fragmentsCollected}/4`);
                    console.log('Fragment collected:', this.fragmentsCollected);
                }, null, this);

                // Pedestal - made bigger and more prominent
                this.pedestal = this.physics.add.sprite(700, 300, 'pedestal_off');
                this.pedestal.setScale(0.6);  // Increased from 0.4 to 0.6 (50% bigger)
                this.pedestal.setDepth(10);
                this.pedestal.body.setImmovable(true);
                this.pedestalActivated = false;
                this.levelComplete = false;
                this.isDying = false;
                
                // Add glow effect around pedestal to make it more prominent
                this.pedestalGlow = this.add.circle(700, 300, 50, 0x00ffff, 0.2);
                this.pedestalGlow.setDepth(9);
                
                // Pulsing glow animation
                this.tweens.add({
                    targets: this.pedestalGlow,
                    alpha: { from: 0.2, to: 0.4 },
                    scale: { from: 1, to: 1.2 },
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                this.physics.add.overlap(this.player, this.pedestal, () => {
                    if (this.pedestalActivated && !this.levelComplete) {
                        this.levelComplete = true;
                        this.completeText.setVisible(true);
                        this.player.setVelocity(0);
                        
                        this.time.delayedCall(2000, () => {
                            this.scene.start('VictoryScene');
                        });
                    }
                }, null, this);

                // UI
                this.fragmentText = this.add.text(20, 20, 'Fragments: 0/4', {
                    fontSize: '24px',
                    fill: '#00ffff',
                    stroke: '#000',
                    strokeThickness: 4
                }).setDepth(100);

                this.add.text(20, 50, 'Stage 2 - Crystal Labyrinth', {
                    fontSize: '18px',
                    fill: '#ffffff',
                    stroke: '#000',
                    strokeThickness: 3
                }).setDepth(100);

                this.completeText = this.add.text(400, 300, 'Stage 2 Complete!', {
                    fontSize: '48px',
                    fill: '#00ffff',
                    fontStyle: 'bold',
                    stroke: '#000',
                    strokeThickness: 6
                }).setOrigin(0.5).setVisible(false).setDepth(100);

                this.keys = this.input.keyboard.createCursorKeys();
                console.log('Keys created');
                console.log('Level2 create complete');
            }

            update() {
                let speed = 200;
                this.player.setVelocity(0);

                if (this.keys.left.isDown) this.player.setVelocityX(-speed);
                if (this.keys.right.isDown) this.player.setVelocityX(speed);
                if (this.keys.up.isDown) this.player.setVelocityY(-speed);
                if (this.keys.down.isDown) this.player.setVelocityY(speed);

                // Check spike collisions
                if (this.spikes && !this.isDying) {
                    for (let spike of this.spikes) {
                        if (spike.checkCollision(this.player)) {
                            this.isDying = true;
                            spike.triggerDeath(this.player);
                            
                            // Reset dying flag after respawn
                            this.time.delayedCall(400, () => {
                                this.isDying = false;
                            });
                            break;
                        }
                    }
                }

                if (this.fragmentsCollected === 4 && !this.pedestalActivated) {
                    this.pedestal.setTexture('pedestal_on');
                    this.pedestalActivated = true;
                    
                    // Change glow to bright green when activated
                    this.pedestalGlow.setFillStyle(0x00ff00, 0.4);
                    
                    // More intense pulsing when activated
                    this.tweens.killTweensOf(this.pedestalGlow);
                    this.tweens.add({
                        targets: this.pedestalGlow,
                        alpha: { from: 0.4, to: 0.7 },
                        scale: { from: 1, to: 1.4 },
                        duration: 1000,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                    
                    console.log('Pedestal activated!');
                }
            }
            
            playPopSound() {
                // Create a pop sound using Web Audio API
                const audioContext = this.sound.context;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Pop effect: quick descending note
                oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            }
            
            shutdown() {
                console.log('Level2 shutdown');
                if (this.time) {
                    this.time.removeAllEvents();
                }
            }
        }

        // VICTORY SCENE - Stage 2 Complete
        class VictoryScene extends Phaser.Scene {
            constructor() {
                super({ key: 'VictoryScene' });
            }

            preload() {
                this.load.setBaseURL('./');
                this.load.image('luma', 'assets/luma.png');
                this.load.video('output', 'assets/output.mp4');
            }

            create() {
                console.log('VictoryScene started');
                
                // Show "Quest Complete!" message first
                this.showCompletionMessage();
            }
            
            showCompletionMessage() {
                // Black background
                this.add.rectangle(400, 300, 800, 600, 0x000000);

                // "Quest Complete!" text
                let completeText = this.add.text(400, 300, 'QUEST COMPLETE!', {
                    fontSize: '64px',
                    fill: '#00ffff',
                    fontStyle: 'bold',
                    stroke: '#ff00ff',
                    strokeThickness: 6
                }).setOrigin(0.5);

                // Fade in
                completeText.setAlpha(0);
                this.tweens.add({
                    targets: completeText,
                    alpha: 1,
                    duration: 1000
                });

                // After 2 seconds, fade out and play cutscene
                this.time.delayedCall(2000, () => {
                    this.tweens.add({
                        targets: completeText,
                        alpha: 0,
                        duration: 500,
                        onComplete: () => {
                            completeText.destroy();
                            this.playCutscene();
                        }
                    });
                });
            }
            
            playCutscene() {
                console.log('Playing output.mp4 cutscene');
                
                // Black background
                this.add.rectangle(400, 300, 800, 600, 0x000000);

                // Try to play video if it loaded
                if (this.cache.video.exists('output')) {
                    console.log('output.mp4 exists, playing...');
                    let video = this.add.video(400, 300, 'output');
                    video.setOrigin(0.5, 0.5);
                    video.play(true);

                    // Skip text
                    let skipText = this.add.text(700, 550, 'Press SPACE to skip', {
                        fontSize: '18px',
                        fill: '#ffffff',
                        stroke: '#000',
                        strokeThickness: 3
                    });

                    // When video ends, show final screen
                    video.on('complete', () => {
                        console.log('Video complete');
                        this.showFinalScreen();
                    });

                    // Handle video errors
                    video.on('error', () => {
                        console.log('Video error, skipping to final screen');
                        this.showFinalScreen();
                    });

                    // Allow skipping with SPACE
                    this.input.keyboard.once('keydown-SPACE', () => {
                        video.stop();
                        this.showFinalScreen();
                    });

                    // Auto-skip after 30 seconds if video is too long
                    this.time.delayedCall(30000, () => {
                        if (this.scene.isActive('VictoryScene')) {
                            video.stop();
                            this.showFinalScreen();
                        }
                    });
                } else {
                    console.log('output.mp4 not found, skipping to final screen');
                    // No video, just show final screen
                    this.time.delayedCall(1000, () => {
                        this.showFinalScreen();
                    });
                }
            }
            
            showFinalScreen() {
                console.log('Showing final screen');
                
                // Clear everything
                this.children.removeAll();
                
                // Crystal cavern background
                let bg = this.add.graphics();
                bg.fillGradientStyle(0x1a1a3e, 0x1a1a3e, 0x2a2a5e, 0x3a3a7e, 1);
                bg.fillRect(0, 0, 800, 600);

                // Starfield
                for (let i = 0; i < 200; i++) {
                    let x = Phaser.Math.Between(0, 800);
                    let y = Phaser.Math.Between(0, 600);
                    this.add.circle(x, y, Phaser.Math.Between(1, 4), 0xffffff, 0.7);
                }

                // Victorious Luma
                let luma = this.add.sprite(400, 250, 'luma');
                luma.setScale(1);

                // Victory text
                let victoryText = this.add.text(400, 400, 'CONGRATULATIONS!', {
                    fontSize: '64px',
                    fill: '#00ffff',
                    fontStyle: 'bold',
                    stroke: '#ff00ff',
                    strokeThickness: 6
                }).setOrigin(0.5);

                // Subtitle
                let subText = this.add.text(400, 470, 'You completed Luma\'s Quest!', {
                    fontSize: '24px',
                    fill: '#ffffff',
                    stroke: '#000',
                    strokeThickness: 3
                }).setOrigin(0.5);

                // Try Again button
                let tryAgainBtn = this.add.text(400, 540, 'TRY AGAIN', {
                    fontSize: '28px',
                    fill: '#ffffff',
                    backgroundColor: '#4a5c8c',
                    padding: { x: 30, y: 10 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                
                tryAgainBtn.on('pointerover', () => {
                    tryAgainBtn.setStyle({ fill: '#ffff00' });
                });
                tryAgainBtn.on('pointerout', () => {
                    tryAgainBtn.setStyle({ fill: '#ffffff' });
                });
                tryAgainBtn.on('pointerdown', () => {
                    console.log('Try Again clicked, restarting game');
                    this.scene.start('StartScreen');
                });
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 } }
            },
            scene: [StartScreen, Cutscene, Intro, PuzzleGame, LevelTransition, Level2Intro, Level2, VictoryScene]
        });
    </script>
